name: Prepare release

on:
    workflow_dispatch:
        inputs:
            mode:
                description: Strategy (auto groups equal versions, otherwise independent)
                required: true
                type: choice
                options:
                    - auto
                    - grouped
                    - independent
                default: auto
            bump:
                description: Default bump for packages that were published before
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: patch
            version:
                description: Optional shared version override (grouped mode)
                required: false
                default: ""
            packages:
                description: Comma-separated npm package names, auto, or all
                required: false
                default: auto
            versions:
                description: Optional JSON package-to-version overrides
                required: false
                default: "{}"
            dist_tag:
                description: npm dist-tag
                required: true
                type: choice
                options:
                    - latest
                    - next
                    - beta
                default: latest

permissions:
    contents: write
    pull-requests: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        env:
            RELEASE_MODE: ${{ inputs.mode }}
            RELEASE_BUMP: ${{ inputs.bump }}
            RELEASE_VERSION: ${{ inputs.version }}
            RELEASE_PACKAGES: ${{ inputs.packages }}
            RELEASE_VERSIONS: ${{ inputs.versions }}
            RELEASE_TAG: ${{ inputs.dist_tag }}
            GH_TOKEN: ${{ github.token }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.14.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Apply release plan
              run: pnpm release:prepare

            - name: Validate release
              run: |
                  pnpm format:check
                  pnpm lint
                  pnpm typecheck
                  pnpm test
                  pnpm build
                  pnpm check:integrations

            - name: Create release pull request
              env:
                  RELEASE_BRANCH: release/prepare-${{ github.run_id }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$RELEASE_BRANCH"
                  git add .release/plan.json packages/*/package.json pnpm-lock.yaml
                  if git diff --cached --quiet; then
                    echo "The requested versions are already committed; no pull request is needed."
                    exit 0
                  fi
                  git commit -m "chore(release): prepare packages"
                  git push --set-upstream origin "$RELEASE_BRANCH"
                  PR_URL="$(gh pr create --base main --head "$RELEASE_BRANCH" --title "chore(release): prepare packages" --body "Automated release preparation. Review and merge this PR, then run the Publish release workflow.")" || {
                    MANUAL_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/${RELEASE_BRANCH}"
                    echo "::warning::GitHub Actions cannot create pull requests for this repository. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General, or open ${MANUAL_URL}"
                    echo "### Pull request creation required" >> "$GITHUB_STEP_SUMMARY"
                    echo "Open [this link](${MANUAL_URL}) to create the release pull request." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  }
                  echo "Created ${PR_URL}"
